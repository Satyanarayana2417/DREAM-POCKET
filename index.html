<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreamPocket</title>
    <meta name="description" content="Simple personal and family expense manager" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DreamPocket" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      function displayError(message, stack) {
        var errorDiv = document.createElement('div');
        errorDiv.style.padding = '20px';
        errorDiv.style.color = 'red';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.background = 'white';
        errorDiv.style.border = '2px solid red';
        errorDiv.style.position = 'absolute';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.width = '100%';
        errorDiv.innerHTML = '<h2>Runtime Error</h2><p>' + message + '</p><pre>' + stack + '</pre>';
        document.body.appendChild(errorDiv);
      }
      window.onerror = function(message, source, lineno, colno, error) {
        displayError(message, (error && error.stack ? error.stack : ''));
      };
      window.addEventListener('unhandledrejection', function(event) {
        displayError('Unhandled Promise Rejection: ' + (event.reason ? event.reason.message || event.reason : 'Unknown'), event.reason && event.reason.stack ? event.reason.stack : '');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
